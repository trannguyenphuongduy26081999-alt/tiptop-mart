<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiptop Mart</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky teal store header (brand, search, cart) over a sale strip; product grid; single-page views swap inside <main>. System fonts only, so it loads fast on weak connections. */
:root{
  --bg:#f2f6f5; --surface:#ffffff; --ink:#13292b; --muted:#526a6c;
  --line:#dbe5e4; --line-strong:#8fa5a6;
  --accent:#0b6e69; --accent-ink:#ffffff;
  --head-bg:#0b5f5b; --head-ink:#ffffff;
  --sale:#ffd24a; --sale-ink:#3a2a00; --star:#a8650a;
  --good:#1b7a43; --good-ink:#ffffff; --bad:#b3261e;
  --pill-on:#dcefed; --focus:#0b6e69; --photo:#ffffff; --alert:#c4341c; --alert-ink:#ffffff;
  --tile-s:75%; --tile-l:91%;
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e191a; --surface:#162526; --ink:#e6f0ef; --muted:#9fb5b6;
    --line:#263a3c; --line-strong:#5b7779;
    --accent:#4cc3bb; --accent-ink:#052421;
    --head-bg:#0a2b2a; --head-ink:#e6f0ef;
    --star:#f2c14e; --good:#52c98a; --good-ink:#062416; --bad:#ff8f86;
    --pill-on:#1e3b3a; --focus:#7fe0d8;
    --tile-s:30%; --tile-l:24%; --alert:#ff7a66; --alert-ink:#2a0a05;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e191a; --surface:#162526; --ink:#e6f0ef; --muted:#9fb5b6;
  --line:#263a3c; --line-strong:#5b7779;
  --accent:#4cc3bb; --accent-ink:#052421;
  --head-bg:#0a2b2a; --head-ink:#e6f0ef;
  --star:#f2c14e; --good:#52c98a; --good-ink:#062416; --bad:#ff8f86;
  --pill-on:#1e3b3a; --focus:#7fe0d8;
  --tile-s:30%; --tile-l:24%; --alert:#ff7a66; --alert-ink:#2a0a05;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:16px/1.5 var(--font);background:var(--bg);color:var(--ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head-bg);z-index:30}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.top :focus-visible{outline-color:var(--sale)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head-bg);color:var(--head-ink)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px}
.brand{order:1;background:none;border:0;padding:0;cursor:pointer;font-weight:800;font-size:1.4rem;letter-spacing:-.02em;color:inherit;display:flex;align-items:center;gap:8px}
.mark{width:20px;height:20px;border-radius:6px;background:var(--sale);display:inline-block;transform:rotate(-8deg)}
.cartbtn{order:2;margin-left:auto;display:flex;align-items:center;gap:8px;background:transparent;border:1.5px solid currentColor;border-radius:8px;padding:8px 14px;min-height:44px;cursor:pointer;color:inherit;font-weight:650}
.count{background:var(--sale);color:var(--sale-ink);border-radius:999px;min-width:22px;padding:0 7px;text-align:center;font-size:.85rem;font-weight:800;line-height:22px}
.search{order:3;flex:1 1 100%;margin:0}
.search input{width:100%;min-height:44px;padding:10px 14px;border-radius:8px;border:0;background:var(--surface);color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.promo{background:var(--sale);color:var(--sale-ink);font-size:.9rem;font-weight:600}
.promo .wrap{padding-block:6px}
@media (min-width:640px){
  .search{order:2;flex:1 1 280px;max-width:520px}
  .cartbtn{order:3;margin-left:0}
  .search+.cartbtn{margin-left:auto}
}

/* page */
main{padding-block:20px 40px;outline:none}
h1{font-size:1.5rem;line-height:1.25;letter-spacing:-.01em;margin:0 0 12px;text-wrap:balance}
h2{font-size:1.1rem;margin:0 0 8px}
p{margin:0}
.sub{color:var(--muted);margin-bottom:16px}
.foot{padding-block:0 28px;color:var(--muted);font-size:.85rem}

/* buttons */
.btn{border-radius:8px;padding:10px 16px;border:1.5px solid transparent;cursor:pointer;min-height:44px;font-weight:650}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line-strong);color:var(--ink)}
.btn.block{width:100%}
.back,.linkbtn{background:none;border:0;padding:6px 0;color:var(--accent);cursor:pointer;font-weight:600;text-align:left}
.back{margin-bottom:8px}
.back:hover,.linkbtn:hover{text-decoration:underline}

/* product grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.plain{display:block;width:100%;padding:0;margin:0;background:none;border:0;cursor:pointer}
.tile{position:relative;aspect-ratio:1/1;max-width:100%;width:100%;display:grid;place-items:center;background:hsl(var(--h) var(--tile-s) var(--tile-l))}
.art{font-size:clamp(52px,16vw,88px);line-height:1}
.tile.photo,.mini.photo{background:var(--photo)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.mini.photo{overflow:hidden}
.mini img{display:block;width:100%;height:100%;object-fit:contain}
.badge{z-index:1;position:absolute;top:8px;left:8px;background:var(--sale);color:var(--sale-ink);font-weight:800;font-size:.8rem;padding:2px 9px;border-radius:999px}
.card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.name{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:650;font-size:.95rem;line-height:1.3}
.name:hover{text-decoration:underline}
.tag{color:var(--muted);font-size:.85rem}
.rate{font-size:.85rem;color:var(--muted)}
.star{color:var(--star);font-weight:700}
.price-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;margin-top:auto;padding-top:6px}
.price{font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums}
.was{color:var(--muted);text-decoration:line-through;font-size:.9rem;font-variant-numeric:tabular-nums}
.card .btn{margin-top:8px}

/* product page */
.pv{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.pv .tile{border-radius:14px;border:1px solid var(--line)}
.pv .art{font-size:clamp(96px,32vw,180px)}
.info{display:flex;flex-direction:column;gap:12px;min-width:0}
.info .price{font-size:1.6rem}
.lead{font-size:1.05rem}
.claims{margin:0;padding-left:1.2rem;display:grid;gap:4px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:650;padding:0;margin-bottom:6px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{position:relative}
.pill input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pill span{display:inline-block;min-height:44px;padding:9px 14px;border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface)}
.pill input:checked+span{border-color:var(--accent);background:var(--pill-on);font-weight:650}
.pill input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions .btn{flex:1 1 140px}
.note{color:var(--muted);font-size:.9rem}
@media (min-width:720px){.pv{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}}

/* cart + checkout */
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:820px){.cols{grid-template-columns:minmax(0,1fr) 320px}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.box.empty{display:grid;gap:12px;justify-items:start}
.line{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.line:first-child{padding-top:0}
.mini{width:64px;height:64px;border-radius:10px;display:grid;place-items:center;font-size:32px;background:hsl(var(--h) var(--tile-s) var(--tile-l))}
.line-name{font-weight:650;line-height:1.3}
.line-opt{color:var(--muted);font-size:.9rem;margin-bottom:6px}
.line-side{text-align:right;display:grid;justify-items:end;gap:2px}
.line-price{font-weight:800;font-variant-numeric:tabular-nums}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line-strong);border-radius:8px}
.qty span{min-width:32px;text-align:center;font-variant-numeric:tabular-nums;font-weight:650}
.step{width:40px;height:40px;background:none;border:0;cursor:pointer;font-size:1.2rem}
.sum-row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-variant-numeric:tabular-nums}
.sum-row.total{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:800;font-size:1.1rem}
.sum-items{margin:0 0 10px;padding:0;list-style:none;display:grid;gap:6px;font-size:.95rem}
.field{margin-bottom:16px}
.label,label.l{display:block;font-weight:650;margin-bottom:4px}
.field input,.field textarea{width:100%;min-height:44px;padding:10px 12px;border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)}
.field textarea{resize:vertical;min-height:150px}
.field input[readonly]{background:var(--bg);color:var(--muted)}
.hint{color:var(--muted);font-size:.9rem;margin-top:4px}
.err{color:var(--bad);font-size:.9rem;margin-top:4px;font-weight:600}

/* confirmation */
.ok{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.check{flex:none;width:48px;height:48px;border-radius:50%;background:var(--good);color:var(--good-ink);display:grid;place-items:center;font-size:1.6rem;font-weight:800}
.code{display:inline-block;font:800 1.8rem/1.2 var(--mono);letter-spacing:.06em;padding:10px 16px;border:2px dashed var(--line-strong);border-radius:10px;background:var(--surface);user-select:all}
.meta{display:grid;gap:4px;margin:14px 0 20px;color:var(--muted)}
.track{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.track li{border-top:5px solid var(--line);padding-top:6px;font-size:.85rem;line-height:1.3;color:var(--muted)}
.track li.done{border-top-color:var(--accent);color:var(--ink)}
.track li.now{border-top-color:var(--sale);color:var(--ink);font-weight:800}
.stack{display:grid;gap:20px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}

/* help */
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface);margin-bottom:16px}
summary{cursor:pointer;font-weight:650}
.phr h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 4px}
.phr ul{margin:0;padding-left:1.2rem;display:grid;gap:2px}
.sent{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--pill-on);border:1px solid var(--accent);font-weight:650}

/* flash sale */
.flash{margin-bottom:28px}
.flash-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
.flash-head h1{margin:0}
.timer{background:var(--alert);color:var(--alert-ink);font-weight:800;padding:6px 14px;border-radius:999px}
.tnum{font-variant-numeric:tabular-nums}
.feat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card.feat{border:2px solid var(--alert)}
.feat .name{font-size:1.15rem}
.feat .tag{font-size:.95rem}
.feat .price{font-size:1.6rem}
.feat .card-body{padding:14px 16px 16px;gap:6px}
.tile.hot .badge{background:var(--alert);color:var(--alert-ink);font-size:1rem;padding:4px 12px}
.left{position:absolute;z-index:1;top:8px;right:8px;background:var(--ink);color:var(--bg);font-weight:700;font-size:.8rem;padding:2px 9px;border-radius:999px}
.kicker{margin:0;font-size:.75rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--alert)}
.stock{color:var(--alert);font-weight:700}
h2.more{font-size:1.25rem;margin:0 0 12px}
@media (max-width:639px){
  .feat-grid{grid-template-columns:minmax(0,1fr)}
}

/* toast */
.toast{position:fixed;z-index:40;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:650}
</style>

<header class="top">
  <div class="wrap bar">
    <button class="brand" type="button" data-act="shop"><span class="mark" aria-hidden="true"></span>Tiptop Mart</button>
    <form class="search" role="search" id="search-form">
      <label class="sr" for="q">Search products</label>
      <input id="q" type="search" placeholder="Search products" autocomplete="off">
    </form>
    <button class="cartbtn" type="button" data-act="cart" id="cartbtn" aria-label="Open cart, 0 items">Cart <span class="count" id="cartCount">0</span></button>
  </div>
  <div class="promo"><div class="wrap">Flash sale today: up to 90% off selected items. Free delivery to your desk.</div></div>
</header>
<main class="wrap" id="app" tabindex="-1"></main>
<footer class="wrap foot">Tiptop Mart is a practice store for English class.</footer>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    { id: 'knife', feat: true, label: 'Staff pick', left: 1, art: '🔪', hue: 215, name: 'ChefEdge Kitchen Knife, 15 cm', tag: 'Razor-sharp stainless steel with a balanced grip', price: 3, was: 30, rating: '4.9', reviews: '9,731',
      claims: ['Stainless steel blade that stays sharp', 'Non-slip comfort handle', 'Protective blade guard included'], optLabel: 'Colour', opts: ['Black handle', 'Red handle'] },
    { id: 'watergun', feat: true, label: 'Hot deal', left: 3, art: '🔫', hue: 195, name: 'SplashMax Water Gun', tag: 'Powerful pump action that soaks targets 8 metres away', price: 5, was: 25, rating: '4.8', reviews: '15,226',
      claims: ['Large 600 ml tank', 'Easy pump action', 'Leak-proof cap'], optLabel: 'Colour', opts: ['Ocean blue', 'Lime green'] },
    { id: 'earbuds', art: '🎧', hue: 270, name: 'SoundBloom Pro Wireless Earbuds', tag: 'Studio-quality sound with a 40-hour battery', price: 69, was: 79, rating: '4.8', reviews: '2,381',
      claims: ['Active noise cancelling', 'Waterproof and sweatproof', 'Comfortable fit for every ear'], optLabel: 'Colour', opts: ['Blush pink', 'Midnight black'] },
    { id: 'powerbank', art: '🔋', hue: 125, name: 'VoltGo Power Bank 10,000 mAh', tag: 'Charges a phone up to three times', price: 34, was: 38, rating: '4.7', reviews: '1,812',
      claims: ['Two built-in charging cables', 'Slim, pocket-size body', 'Built-in safety protection'], optLabel: 'Colour', opts: ['Black', 'White'] },
    { id: 'speaker', art: '🔊', hue: 240, name: 'EchoPod Mini Bluetooth Speaker', tag: 'Room-filling sound in a pocket-size body', price: 39, was: 42, rating: '4.6', reviews: '1,240',
      claims: ['12 hours of playtime', 'Waterproof for the pool or beach', 'Connects in seconds'], optLabel: 'Colour', opts: ['White', 'Black'] },
    { id: 'sunglasses', art: '🕶️', hue: 290, name: 'SunShield Polarised Sunglasses', tag: 'UV400 protection and an unbreakable frame', price: 27, was: 30, rating: '4.5', reviews: '742',
      claims: ['Polarised lenses', 'Flexible, unbreakable frame', 'Soft carry case included'], optLabel: 'Style', opts: ['Classic black', 'Tortoise brown'] },
    { id: 'notebooks', art: '📓', hue: 330, name: 'PageTurn Spiral Notebook Set, 3 pack', tag: 'Three eco-friendly spiral notebooks, each with its own pen', price: 11, was: 12, rating: '4.6', reviews: '1,330',
      claims: ['Thick recycled paper, no ink bleed', 'Handy pocket on every cover', 'Matching pen included with each notebook'], optLabel: 'Colour', opts: ['Black, blue and red', 'Kraft and grey'] },
    { id: 'umbrella', art: '☂️', hue: 350, name: 'StormGuard Mini Folding Umbrella', tag: 'Folds down to 24 cm and survives strong wind', price: 14, rating: '4.6', reviews: '1,115',
      claims: ['Windproof double frame', 'Large 100 cm canopy', 'Quick-dry fabric'], optLabel: 'Colour', opts: ['Steel blue', 'Black'] },
    { id: 'scarf', art: '🧣', hue: 60, name: 'CloudSoft Cashmere-Feel Scarf', tag: 'Extra long, wonderfully soft and warm', price: 17, rating: '4.7', reviews: '865',
      claims: ['Cashmere-soft touch', '200 cm long', 'Machine washable'], optLabel: 'Colour', opts: ['Grey and camel', 'Stone grey', 'Burgundy'] }
  ];

  var state = { view: 'shop', pid: null, query: '', cart: [], order: null };
  var app = document.getElementById('app');
  var qInput = document.getElementById('q');
  var countEl = document.getElementById('cartCount');
  var cartBtn = document.getElementById('cartbtn');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  var timerEnd = Date.now() + (9 * 60 + 41) * 1000;
  function fmtTimer() {
    var secs = Math.ceil((timerEnd - Date.now()) / 1000);
    if (secs <= 0) { timerEnd = Date.now() + 10 * 60 * 1000; secs = 600; }
    var m = Math.floor(secs / 60), r = secs % 60;
    return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
  }
  setInterval(function () {
    var t = document.getElementById('timer');
    if (t) t.textContent = fmtTimer();
  }, 1000);

  function money(n) { return '$' + n.toFixed(2); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function byId(id) { return PRODUCTS.filter(function (p) { return p.id === id; })[0]; }
  function deal(p) { return !!p.was && p.was > p.price; }
  function off(p) { return deal(p) ? Math.round((1 - p.price / p.was) * 100) : 0; }
  function priceRow(p) {
    return '<div class="price-row"><span class="price">' + money(p.price) + '</span>' +
      (deal(p) ? '<span class="was">' + money(p.was) + '</span>' : '') + '</div>';
  }
  function cartQty() { return state.cart.reduce(function (n, l) { return n + l.qty; }, 0); }
  function cartTotal() { return state.cart.reduce(function (n, l) { return n + l.qty * byId(l.pid).price; }, 0); }

  function updateCount() {
    var n = cartQty();
    countEl.textContent = n;
    cartBtn.setAttribute('aria-label', 'Open cart, ' + n + (n === 1 ? ' item' : ' items'));
  }
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 1800);
  }

  function tile(p) {
    var img = IMG[p.id];
    var inner = img ? '<img src="' + img + '" alt="">' : '<span class="art" aria-hidden="true">' + p.art + '</span>';
    var badge = deal(p) ? '<span class="badge">-' + off(p) + '%</span>' : '';
    var left = p.left ? '<span class="left">Only ' + p.left + ' left</span>' : '';
    return '<div class="tile' + (img ? ' photo' : '') + (p.feat ? ' hot' : '') + '" style="--h:' + p.hue + '">' + inner + badge + left + '</div>';
  }

  /* ---------- views ---------- */
  function cardHtml(p) {
    return '<article class="card' + (p.feat ? ' feat' : '') + '">' +
      '<button type="button" class="plain" tabindex="-1" aria-hidden="true" data-act="open" data-id="' + p.id + '">' + tile(p) + '</button>' +
      '<div class="card-body">' +
      (p.label ? '<p class="kicker">' + p.label + '</p>' : '') +
      '<button type="button" class="name" data-act="open" data-id="' + p.id + '">' + p.name + '</button>' +
      '<p class="tag">' + p.tag + '</p>' +
      '<p class="rate"><span class="star">★ ' + p.rating + '</span> (' + p.reviews + ')</p>' +
      priceRow(p) +
      '<button type="button" class="btn ' + (p.feat ? 'primary' : 'ghost') + '" data-act="open" data-id="' + p.id + '">View item</button>' +
      '</div></article>';
  }

  function viewShop() {
    var q = state.query.trim().toLowerCase();
    if (q) {
      var list = PRODUCTS.filter(function (p) {
        return (p.name + ' ' + p.tag).toLowerCase().indexOf(q) !== -1;
      });
      var head = '<h1>Search results</h1><p class="sub">' + list.length + (list.length === 1 ? ' product' : ' products') + '</p>';
      if (!list.length) {
        return head + '<div class="box empty"><p>No products match “' + esc(state.query.trim()) + '”. Try another word.</p>' +
          '<button type="button" class="btn primary" data-act="shop">Show all products</button></div>';
      }
      return head + '<div class="grid">' + list.map(cardHtml).join('') + '</div>';
    }
    var feat = PRODUCTS.filter(function (p) { return p.feat; });
    var rest = PRODUCTS.filter(function (p) { return !p.feat; });
    return '<section class="flash"><div class="flash-head"><h1>Flash sale</h1>' +
      '<p class="timer">Ends in <span id="timer" class="tnum">' + fmtTimer() + '</span></p></div>' +
      '<div class="feat-grid">' + feat.map(cardHtml).join('') + '</div></section>' +
      '<h2 class="more">More great products</h2><div class="grid">' + rest.map(cardHtml).join('') + '</div>';
  }

  function viewProduct() {
    var p = byId(state.pid);
    var pills = p.opts.map(function (v, i) {
      return '<label class="pill"><input type="radio" name="opt" value="' + esc(v) + '"' + (i === 0 ? ' checked' : '') + '><span>' + esc(v) + '</span></label>';
    }).join('');
    return '<button type="button" class="back" data-act="shop">← All products</button>' +
      '<div class="pv">' + tile(p) +
      '<div class="info">' +
      (p.label ? '<p class="kicker">' + p.label + '</p>' : '') + '<h1>' + p.name + '</h1>' +
      '<p class="rate"><span class="star">★ ' + p.rating + '</span> (' + p.reviews + ' reviews)</p>' +
      priceRow(p) + (p.left ? '<p class="stock">Only ' + p.left + ' left in stock. Selling fast.</p>' : '') +
      '<p class="lead">' + p.tag + '</p>' +
      '<ul class="claims">' + p.claims.map(function (c) { return '<li>' + c + '</li>'; }).join('') + '</ul>' +
      '<fieldset><legend>' + p.optLabel + '</legend><div class="pills">' + pills + '</div></fieldset>' +
      '<div class="actions">' +
      '<button type="button" class="btn primary" data-act="buy" data-id="' + p.id + '">Buy now</button>' +
      '<button type="button" class="btn ghost" data-act="add" data-id="' + p.id + '">Add to cart</button>' +
      '</div>' +
      '<p class="note">Free delivery to your desk. Pay on delivery.</p>' +
      '</div></div>';
  }

  function summaryRows() {
    return '<div class="sum-row"><span>Subtotal</span><span>' + money(cartTotal()) + '</span></div>' +
      '<div class="sum-row"><span>Delivery</span><span>Free</span></div>' +
      '<div class="sum-row total"><span>Total</span><span>' + money(cartTotal()) + '</span></div>';
  }

  function viewCart() {
    if (!state.cart.length) {
      return '<h1>Your cart</h1><div class="box empty"><p>Your cart is empty.</p>' +
        '<button type="button" class="btn primary" data-act="shop">Keep shopping</button></div>';
    }
    var lines = state.cart.map(function (l, i) {
      var p = byId(l.pid);
      return '<div class="line">' +
        '<div class="mini' + (IMG[p.id] ? ' photo' : '') + '" style="--h:' + p.hue + '" aria-hidden="true">' + (IMG[p.id] ? '<img src="' + IMG[p.id] + '" alt="">' : p.art) + '</div>' +
        '<div><p class="line-name">' + p.name + '</p><p class="line-opt">' + p.optLabel + ': ' + esc(l.opt) + '</p>' +
        '<div class="qty"><button type="button" class="step" data-act="dec" data-i="' + i + '" aria-label="Fewer ' + esc(p.name) + '">−</button>' +
        '<span>' + l.qty + '</span>' +
        '<button type="button" class="step" data-act="inc" data-i="' + i + '" aria-label="More ' + esc(p.name) + '">+</button></div></div>' +
        '<div class="line-side"><p class="line-price">' + money(l.qty * p.price) + '</p>' +
        '<button type="button" class="linkbtn" data-act="remove" data-i="' + i + '">Remove</button></div>' +
        '</div>';
    }).join('');
    return '<h1>Your cart</h1><div class="cols"><section class="box">' + lines + '</section>' +
      '<aside class="box"><h2>Order summary</h2>' + summaryRows() +
      '<div style="height:12px"></div><button type="button" class="btn primary block" data-act="checkout">Go to checkout</button>' +
      '<div style="height:8px"></div><button type="button" class="btn ghost block" data-act="shop">Keep shopping</button></aside></div>';
  }

  function viewCheckout() {
    var items = state.cart.map(function (l) {
      var p = byId(l.pid);
      return '<li>' + l.qty + ' × ' + p.name + ' <span class="hint">(' + esc(l.opt) + ')</span></li>';
    }).join('');
    return '<button type="button" class="back" data-act="cart">← Back to cart</button><h1>Checkout</h1>' +
      '<div class="cols">' +
      '<form class="box" id="checkout-form" novalidate>' +
      '<div class="field"><label class="l" for="nick">Your nickname or desk number</label>' +
      '<input id="nick" name="nick" type="text" maxlength="30" autocomplete="off" aria-describedby="nick-hint nick-err">' +
      '<p class="hint" id="nick-hint">Your seller uses this to find your desk.</p>' +
      '<p class="err" id="nick-err" hidden>Please enter a nickname or desk number.</p></div>' +
      '<div class="field"><p class="label">Delivery</p><p>To your desk, in this classroom. Free.</p></div>' +
      '<div class="field"><p class="label">Payment</p><p>Pay on delivery. You pay nothing now.</p></div>' +
      '<button type="submit" class="btn primary block">Place order</button></form>' +
      '<aside class="box"><h2>Your items</h2><ul class="sum-items">' + items + '</ul>' + summaryRows() + '</aside></div>';
  }

  function viewDone() {
    var o = state.order;
    var items = o.items.map(function (l) {
      return '<li>' + l.qty + ' × ' + l.name + ' <span class="hint">(' + esc(l.opt) + ')</span></li>';
    }).join('');
    return '<div class="stack">' +
      '<div><div class="ok"><span class="check" aria-hidden="true">✓</span><h1 style="margin:0">Order confirmed</h1></div>' +
      '<p class="sub" style="margin-bottom:10px">Thank you, ' + esc(o.nick) + '. Your order code:</p>' +
      '<p class="code">' + o.code + '</p>' +
      '<div class="meta"><p>Placed at ' + o.time + '</p><p>Delivery to: ' + esc(o.nick) + ', your desk</p><p>Total to pay on delivery: ' + money(o.total) + '</p></div></div>' +
      '<section class="box"><h2>Delivery status</h2>' +
      '<ol class="track"><li class="done">Order placed</li><li class="done">Packed</li><li class="now">Out for delivery</li><li>Delivered</li></ol></section>' +
      '<section class="box"><h2>Items</h2><ul class="sum-items">' + items + '</ul></section>' +
      '<div class="btnrow"><button type="button" class="btn primary" data-act="help">Problem with your order?</button>' +
      '<button type="button" class="btn ghost" data-act="shop">Back to shop</button></div></div>';
  }

  function viewHelp() {
    var o = state.order;
    return '<button type="button" class="back" data-act="done">← Back to your order</button>' +
      '<h1>Contact the seller</h1><p class="sub">Tell us what went wrong with your order.</p>' +
      '<div class="cols"><form class="box" id="help-form" novalidate>' +
      '<div class="field"><label class="l" for="code">Order code</label><input id="code" type="text" value="' + o.code + '" readonly></div>' +
      '<div class="field"><label class="l" for="subject">Subject</label><input id="subject" type="text" maxlength="80" autocomplete="off"></div>' +
      '<div class="field"><label class="l" for="msg">Your message</label>' +
      '<textarea id="msg" rows="7" aria-describedby="msg-err"></textarea>' +
      '<p class="err" id="msg-err" hidden>Write your message first.</p></div>' +
      '<button type="submit" class="btn primary block">Send message</button>' +
      '<p class="sent" id="sent" role="status" hidden>Your message is ready. Show this screen to your seller.</p></form>' +
      '<aside><details><summary>Need help with the wording?</summary><div class="phr">' +
      '<h3>Start politely</h3><ul><li>I’m writing about my recent order.</li><li>I’m afraid there is a problem with my order.</li></ul>' +
      '<h3>Explain the problem</h3><ul><li>The item I received is not what I ordered.</li><li>It doesn’t match the description on your website.</li><li>The size and colour are different from the picture.</li></ul>' +
      '<h3>Ask for a solution</h3><ul><li>Could you please send me the correct item?</li><li>I would appreciate a refund or a replacement.</li><li>Could you tell me what the next step is?</li></ul>' +
      '<h3>Finish politely</h3><ul><li>Thank you for your help.</li><li>I look forward to hearing from you.</li></ul>' +
      '</div></details></aside></div>';
  }

  function render() {
    var v = state.view;
    if (v === 'shop') app.innerHTML = viewShop();
    else if (v === 'product') app.innerHTML = viewProduct();
    else if (v === 'cart') app.innerHTML = viewCart();
    else if (v === 'checkout') app.innerHTML = viewCheckout();
    else if (v === 'done') app.innerHTML = viewDone();
    else if (v === 'help') app.innerHTML = viewHelp();
    updateCount();
  }
  function show(view, pid) {
    if (view === 'checkout' && !state.cart.length) view = 'cart';
    if ((view === 'done' || view === 'help') && !state.order) view = 'shop';
    state.view = view;
    if (pid) state.pid = pid;
    render();
    window.scrollTo(0, 0);
    try { app.focus({ preventScroll: true }); } catch (e) {}
  }

  /* ---------- cart actions ---------- */
  function addToCart(id) {
    var checked = app.querySelector('input[name="opt"]:checked');
    var opt = checked ? checked.value : byId(id).opts[0];
    for (var i = 0; i < state.cart.length; i++) {
      if (state.cart[i].pid === id && state.cart[i].opt === opt) {
        state.cart[i].qty = Math.min(9, state.cart[i].qty + 1);
        updateCount();
        return;
      }
    }
    state.cart.push({ pid: id, opt: opt, qty: 1 });
    updateCount();
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act');
    var id = b.getAttribute('data-id');
    var i = parseInt(b.getAttribute('data-i'), 10);
    if (act === 'shop') { state.query = ''; qInput.value = ''; show('shop'); }
    else if (act === 'open') show('product', id);
    else if (act === 'add') { addToCart(id); toast('Added to cart'); }
    else if (act === 'buy') { addToCart(id); show('checkout'); }
    else if (act === 'cart') show('cart');
    else if (act === 'checkout') show('checkout');
    else if (act === 'help') show('help');
    else if (act === 'done') show('done');
    else if (act === 'inc') { state.cart[i].qty = Math.min(9, state.cart[i].qty + 1); render(); }
    else if (act === 'dec') {
      state.cart[i].qty -= 1;
      if (state.cart[i].qty <= 0) state.cart.splice(i, 1);
      render();
    }
    else if (act === 'remove') { state.cart.splice(i, 1); render(); }
  });

  document.addEventListener('submit', function (e) {
    var f = e.target;
    e.preventDefault();
    if (f.id === 'checkout-form') {
      var nick = document.getElementById('nick').value.trim();
      var err = document.getElementById('nick-err');
      if (!nick) {
        err.hidden = false;
        document.getElementById('nick').focus();
        return;
      }
      state.order = {
        code: 'TM-' + (1000 + Math.floor(Math.random() * 9000)),
        nick: nick,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        total: cartTotal(),
        items: state.cart.map(function (l) { return { name: byId(l.pid).name, opt: l.opt, qty: l.qty }; })
      };
      state.cart = [];
      show('done');
    } else if (f.id === 'help-form') {
      var msg = document.getElementById('msg');
      var merr = document.getElementById('msg-err');
      var sent = document.getElementById('sent');
      if (!msg.value.trim()) {
        merr.hidden = false; sent.hidden = true; msg.focus();
        return;
      }
      merr.hidden = true; sent.hidden = false;
    } else if (f.id === 'search-form') {
      qInput.blur();
    }
  });

  qInput.addEventListener('input', function () {
    state.query = qInput.value;
    state.view = 'shop';
    render();
  });

  render();
})();
</script>
